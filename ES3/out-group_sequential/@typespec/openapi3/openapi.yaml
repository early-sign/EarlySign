        alpha:
          type: number
          format: double
        sided:
          type: string
          enum:
            - one
            - two
          default: two
      allOf:
        - $ref: '#/components/schemas/GST.BoundaryFunctionStrategyBase'
      description: Pocock Strategy.
    GST.PromisingZoneSpec:
      type: object
      required:
        - conditional_power_threshold_min
        - conditional_power_threshold_max
        - target_conditional_power
      properties:
        conditional_power_threshold_min:
          type: number
          format: double
        conditional_power_threshold_max:
          type: number
          format: double
        target_conditional_power:
          type: number
          format: double
    GST.PromisingZoneStatus:
      type: string
      enum:
        - futility
        - efficacy
        - promising
        - continue
    GST.Protocol:
      type: object
      required:
        - task
        - method
