          type: object
          additionalProperties:
            type: number
            format: double
          description: Arm name -> Hazard Ratio (relative to control)
        median_survival_times:
          type: object
          additionalProperties:
            type: number
            format: double
          description: 'Optional: for sample size calc'
        event_rate:
          type: number
          format: double
