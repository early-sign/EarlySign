          default: obrien_fleming
        alpha:
          type: number
          format: double
        sided:
          type: string
          enum:
            - one
            - two
          default: two
      allOf:
        - $ref: '#/components/schemas/GST.BoundaryFunctionStrategyBase'
      description: Classic O'Brien-Fleming Strategy.
    GST.OddsRatio:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - odds_ratio
          default: odds_ratio
      allOf:
        - $ref: '#/components/schemas/GST.EffectMeasureBase'
    GST.OneArmBinomialZ:
      type: object
      required:
        - kind
        - information_unit
        - variance_source
      properties:
        kind:
          type: string
          enum:
            - one_arm_binomial_z
          default: one_arm_binomial_z
        information_unit:
          type: string
          enum:
            - fisher_information
          default: fisher_information
        variance_source:
          type: string
          enum:
            - sample
            - null_hypothesis
          description: |-
            Variance source.
            - "sample": Uses observed estimate (Wald-like).
            - "null_hypothesis": Uses null parameter (Score-like).
          default: null_hypothesis
      allOf:
        - $ref: '#/components/schemas/GST.TestStatisticSpec'
      description: One-Arm Binomial Z-Statistic.
    GST.OneArmContinuousVariance:
      anyOf:
        - $ref: '#/components/schemas/GST.KnownVariance'
