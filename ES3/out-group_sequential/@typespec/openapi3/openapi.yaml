          default: fisher_information
        variance_estimation:
          type: string
          enum:
            - pooled
            - unpooled
          description: |-
            Variance estimation method.
            - "unpooled": Wald Z (Observed).
            - "pooled": Score Z (Null/Common).
          default: pooled
      allOf:
        - $ref: '#/components/schemas/GST.TestStatisticSpec'
      description: |-
        Two-Arm Binomial Z-Statistic.
        Covers both Wald Z (unpooled) and Score Z (pooled).
