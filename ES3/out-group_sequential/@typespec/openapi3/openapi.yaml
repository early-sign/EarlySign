    GST.OneArmContinuousZ:
      type: object
      required:
        - kind
        - information_unit
        - variance
      properties:
        kind:
          type: string
          enum:
            - one_arm_continuous_z
          default: one_arm_continuous_z
        information_unit:
          type: string
          enum:
            - fisher_information
          default: fisher_information
        variance:
          $ref: '#/components/schemas/GST.OneArmContinuousVariance'
      allOf:
        - $ref: '#/components/schemas/GST.TestStatisticSpec'
      description: One-Arm Continuous Z-Statistic.
    GST.OneArmEstimatedVariance:
      type: object
