        method:
          allOf:
            - $ref: '#/components/schemas/GST.MethodSpec'
          description: The GST method specification.
      allOf:
        - $ref: '#/components/schemas/Base.Protocol'
      description: |-
        GST-Specific Protocol Container.
        Enforces that task and method belong to the GST domain.
    GST.RelativeImprovement:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - relative_improvement
          default: relative_improvement
      allOf:
        - $ref: '#/components/schemas/GST.EffectMeasureBase'
    GST.RelativeRisk:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - relative_risk
          default: relative_risk
      allOf:
        - $ref: '#/components/schemas/GST.EffectMeasureBase'
    GST.SampleSizeReestimationSpec:
      type: object
      required:
        - type
        - method
        - target_power
        - n_range
      properties:
        type:
          type: string
          enum:
            - sample_size_reestimation
        method:
          type: string
          enum:
            - conditional_power
            - predictive_power
        target_power:
          type: number
          format: double
        use_weighted_statistic:
          type: boolean
          description: Whether to use a weighted test statistic (e.g., Cui-Hung-Wang) after adaptation to preserve Type I error.
          default: true
        n_range:
          type: array
          items: {}
        promising_zone:
          allOf:
            - $ref: '#/components/schemas/GST.PromisingZoneSpec'
          description: Promising zone configuration.
    GST.SampleSizeTimer:
      type: object
      required:
        - kind
        - unit
        - max_sample_size
      properties:
        kind:
          type: string
          enum:
            - sample_size
          default: sample_size
        unit:
          type: string
          enum:
            - individuals
            - effective_size
          description: |-
            "individuals": Count individuals (e.g. n1 + n2).
            "effective_size": Effective sample size (e.g. 4*n1*n2/(n1+n2)).
          default: individuals
        max_sample_size:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: The maximum sample size (per-arm).
      allOf:
        - $ref: '#/components/schemas/GST.InformationTimerBase'
    GST.ScheduleBase:
      type: object
      required:
        - kind
      properties:
