        - pocock
        - power_family
        - hwang_shih_decani
      description: Available spending function types for group sequential design.
    GST.StatisticalModel:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
      description: 'The "Model": Statistical Assumptions for Inference.'
