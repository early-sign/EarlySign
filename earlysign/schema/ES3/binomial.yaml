id: https://earlysign.io/schema/ES3/binomial
name: es3_binomial
title: EarlySign Binomial Core Schema

imports:
  - linkml:types
  - ./base

default_range: string
default_prefix: https://earlysign.io/schema/ES3/binomial/

classes:

  BinomialArmMetrics:
    is_a: ArmMetrics
    attributes:
      successes:
        range: integer
        required: true
      p_hat:
        range: float
        required: true

  ExactBinomialModel:
    is_a: Log
    attributes:
      kind:
        range: string
        equals_string: exact_binomial
        ifabsent: string(exact_binomial)
        required: true

  BinomialArmData:
    is_a: Log
    attributes:
      arm:
        range: string
        required: true
      total:
        range: integer
        required: true
      success:
        range: integer
        required: true
