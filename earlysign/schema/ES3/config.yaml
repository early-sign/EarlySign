# Official LinkML Project Configuration (Zero-Monkey-Patch)
directory: sdk_output
includes:
  - pydantic
generators:
  pydantic:
    generator_args:
      # These flags ensure that the Pydantic generator respects 
      # the modular boundaries of the project.
      mergeimports: false
      # LinkML v1.10.x uses the importmap to resolve cross-file references
      importmap: ../../../importmap.yaml
