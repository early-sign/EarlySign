id: https://earlysign.io/schema/ES3/group_sequential
name: es3_group_sequential
title: EarlySign Group Sequential Test (GST) Method Schema

prefixes:
  linkml: https://w3id.org/linkml/
  base: https://earlysign.io/schema/ES3/base/

imports:
  - linkml:types
  - ../../schema/ES3/base

default_range: string
default_prefix: https://earlysign.io/schema/ES3/group_sequential/

enums:

  DecisionStatus:
    permissible_values:
      CONTINUE: {}
      STOP_EFFICACY: {}
      STOP_FUTILITY: {}
      STOP_PLAN_END_REACHED: {}
      STOP: {}

  Sided:
    permissible_values:
      ONE:
        description: one
      TWO:
        description: two

  ResponseType:
    permissible_values:
      BINARY: {}
      CONTINUOUS: {}
      TIME_TO_EVENT: {}

  SpendingFunctionType:
    permissible_values:
      OBRIEN_FLEMING: {}
      POCOCK: {}
      POWER_FAMILY: {}
      HWANG_SHIH_DECANI: {}

  VarianceEstimation:
    permissible_values:
      POOLED: {}
      UNPOOLED: {}

  # Renamed for controller compatibility (protocol_design.py:555)
  MethodModel:
    permissible_values:
      POOLED: {}
      UNPOOLED: {}

  SampleSizeTimerUnit:
    permissible_values:
      INDIVIDUALS: {}
      EFFECTIVE_SIZE: {}

  # Legacy name compatibility (Method) for SSR
  Method:
    permissible_values:
      CONDITIONAL_POWER: {}
      PREDICTIVE_POWER: {}

  PromisingZoneStatus:
    permissible_values:
      FUTILITY: {}
      EFFICACY: {}
      PROMISING: {}
      CONTINUE: {}

  MultiplicityAdjustment:
    permissible_values:
      NONE: {}
      BONFERRONI: {}
      HOLM: {}
      HOCHBERG: {}
      GATEKEEPING: {}

  VarianceSource:
     permissible_values:
       SAMPLE:
         description: sample
       NULL_HYPOTHESIS:
         description: null_hypothesis

  # Naming alignment with existing code: Unit
  Unit:
    permissible_values:
      FISHER_INFORMATION: {}
      SAMPLE_SIZE: {}
      EVENT_COUNT: {}
      INDIVIDUALS:
        description: individuals

classes:

  # ---- Subcomponents ----

  EfficacyRequirement:
    is_a: Log
    attributes:
      alpha:
        range: float
        required: true
      binding:
        range: boolean
        ifabsent: true

  FutilityRequirement:
    is_a: Log
    attributes:
      power:
        range: float
        required: true
      binding:
        range: boolean
        ifabsent: false

  # ---- Hypothesis ----

  HypothesisParametersBase:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true

  EqualityHypothesis:
    is_a: HypothesisParametersBase
    attributes:
      kind:
        range: string
        equals_string: equality
        ifabsent: string(equality)

  SuperiorityHypothesis:
    is_a: HypothesisParametersBase
    attributes:
      kind:
        range: string
        equals_string: superiority
        ifabsent: string(superiority)
      superiority_margin:
        range: float
        ifabsent: float(0.0)

  NonInferiorityHypothesis:
    is_a: HypothesisParametersBase
    attributes:
      kind:
        range: string
        equals_string: non_inferiority
        ifabsent: string(non_inferiority)
      non_inferiority_margin:
        range: float
        required: true

  EquivalenceHypothesis:
    is_a: HypothesisParametersBase
    attributes:
      kind:
        range: string
        equals_string: equivalence
        ifabsent: string(equivalence)
      lower_margin:
        range: float
        required: true
      upper_margin:
        range: float
        required: true

  BinaryEffectSize:
    is_a: Log
    attributes:
      type:
        range: string
        equals_string: binary
        ifabsent: string(binary)
      proportions:
        range: float
        multivalued: true
        inlined: true
        required: true
        annotations:
          python_range:
            tag: python_range
            value: Dict[str, float]

  ContinuousEffectSize:
    is_a: Log
    attributes:
      type:
        range: string
        equals_string: continuous
        ifabsent: string(continuous)
      means:
        range: float
        multivalued: true
        inlined: true
        required: true
        annotations:
          python_range:
            tag: python_range
            value: Dict[str, float]
      standard_deviation:
        range: float
        required: true

  SurvivalEffectSize:
    is_a: Log
    attributes:
      type:
        range: string
        equals_string: time_to_event
        ifabsent: string(time_to_event)
      hazard_ratios:
        range: float
        multivalued: true
        inlined: true
        required: true
        annotations:
          python_range:
            tag: python_range
            value: Dict[str, float]
      median_survival_times:
        range: float
        multivalued: true
        inlined: true
        annotations:
          python_range:
            tag: python_range
            value: Optional[Dict[str, float]]
      event_rate:
        range: float

  # --- Effect Measure ---

  EffectMeasureBase:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true
      value:
        range: float
        required: true

  AbsoluteDifference:
    is_a: EffectMeasureBase
    attributes:
      kind:
        range: string
        equals_string: absolute_difference
        ifabsent: string(absolute_difference)

  OddsRatio:
    is_a: EffectMeasureBase
    attributes:
      kind:
        range: string
        equals_string: odds_ratio
        ifabsent: string(odds_ratio)

  RelativeRisk:
    is_a: EffectMeasureBase
    attributes:
      kind:
        range: string
        equals_string: relative_risk
        ifabsent: string(relative_risk)

  RelativeImprovement:
    is_a: EffectMeasureBase
    attributes:
      kind:
        range: string
        equals_string: relative_improvement
        ifabsent: string(relative_improvement)

  EffectMeasure:
    union_of:
      - AbsoluteDifference
      - OddsRatio
      - RelativeRisk
      - RelativeImprovement

  # ---- Statistical Model ----

  StatisticalModel:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true

  CanonicalGaussianModel:
    is_a: StatisticalModel
    attributes:
      kind:
        range: string
        equals_string: canonical_gaussian
        ifabsent: string(canonical_gaussian)

  ExactBinomialModel:
    is_a: StatisticalModel
    attributes:
      kind:
        range: string
        equals_string: exact_binomial
        ifabsent: string(exact_binomial)

  TProcessModel:
    is_a: StatisticalModel
    attributes:
      kind:
        range: string
        equals_string: t_process
        ifabsent: string(t_process)
      degrees_of_freedom_method:
        range: string
        required: true

  # ---- Variance Specifications ----

  KnownVariance:
    is_a: Log
    attributes:
      kind:
        range: string
        equals_string: known
        ifabsent: string(known)
      value:
        range: float
        required: true

  TwoArmEstimatedVariance:
    is_a: Log
    attributes:
      kind:
        range: string
        equals_string: estimated
        ifabsent: string(estimated)
      method:
        range: MethodModel
        ifabsent: string(POOLED)

  OneArmEstimatedVariance:
    is_a: Log
    attributes:
      kind:
        range: string
        equals_string: estimated
        ifabsent: string(estimated)

  # ---- Test Statistics ----

  TestStatisticSpec:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true

  TwoArmBinomialZ:
    is_a: TestStatisticSpec
    attributes:
      kind:
        range: string
        equals_string: two_arm_binomial_z
        ifabsent: string(two_arm_binomial_z)
      information_unit:
        range: Unit
        ifabsent: string(FISHER_INFORMATION)
      variance_estimation:
        range: VarianceEstimation
        ifabsent: string(POOLED)

  OneArmBinomialZ:
    is_a: TestStatisticSpec
    attributes:
      kind:
        range: string
        equals_string: one_arm_binomial_z
        ifabsent: string(one_arm_binomial_z)
      information_unit:
        range: Unit
        ifabsent: string(FISHER_INFORMATION)
      variance_source:
        range: VarianceSource
        ifabsent: string(NULL_HYPOTHESIS)

  BinomialExactStatistic:
    is_a: TestStatisticSpec
    attributes:
      kind:
        range: string
        equals_string: binomial_exact
        ifabsent: string(binomial_exact)

  TwoArmContinuousZ:
    is_a: TestStatisticSpec
    attributes:
      kind:
        range: string
        equals_string: two_arm_continuous_z
        ifabsent: string(two_arm_continuous_z)
      # protocol_design.py passes "fisher_information" as string
      information_unit:
        range: string
        ifabsent: string(FISHER_INFORMATION)
      variance:
        range: Log
        required: true
        any_of:
          - range: KnownVariance
          - range: TwoArmEstimatedVariance

  OneArmContinuousZ:
    is_a: TestStatisticSpec
    attributes:
      kind:
        range: string
        equals_string: one_arm_continuous_z
        ifabsent: string(one_arm_continuous_z)
      information_unit:
        range: string
        ifabsent: string(FISHER_INFORMATION)
      variance:
        range: Log
        required: true
        any_of:
          - range: KnownVariance
          - range: OneArmEstimatedVariance

  # ---- Spending Functions ----

  SpendingFunction:
    is_a: Log
    attributes:
      family:
        range: string
        required: true
      params:
        range: float
        multivalued: true
        inlined: true
        annotations:
          python_range:
            tag: python_range
            value: Optional[Dict[str, float]]

  # ---- Decision Strategies ----

  DecisionStrategySpec:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true
      statistical_model:
        range: StatisticalModel
        required: true
        inlined: true
        any_of:
          - range: CanonicalGaussianModel
          - range: ExactBinomialModel
          - range: TProcessModel

  AlphaSpendingStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: alpha_spending
        ifabsent: string(alpha_spending)
      spending_fn:
        range: SpendingFunction
        required: true
        inlined: true
      budget:
        range: float
        required: true
      sided:
        range: Sided
        ifabsent: string(TWO)

  BetaSpendingStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: beta_spending
        ifabsent: string(beta_spending)
      spending_fn:
        range: SpendingFunction
        required: true
        inlined: true
      budget:
        range: float
        required: true

  AlphaBetaSpendingStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: alpha_beta_spending
        ifabsent: string(alpha_beta_spending)
      alpha_spending_fn:
        range: SpendingFunction
        required: true
        inlined: true
      beta_spending_fn:
        range: SpendingFunction
        required: true
        inlined: true
      alpha_budget:
        range: float
        required: true
      beta_budget:
        range: float
        required: true
      alpha_binding:
        range: boolean
        ifabsent: true
      beta_binding:
        range: boolean
        ifabsent: false

  OBrienFlemingStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: obrien_fleming
        ifabsent: string(obrien_fleming)
      alpha:
        range: float
        required: true
      sided:
        range: Sided
        ifabsent: string(TWO)

  PocockStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: pocock
        ifabsent: string(pocock)
      alpha:
        range: float
        required: true
      sided:
        range: Sided
        ifabsent: string(TWO)

  WangTsiatisStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: wang_tsiatis
        ifabsent: string(wang_tsiatis)
      alpha:
        range: float
        required: true
      delta:
        range: float
        required: true
      sided:
        range: Sided
        ifabsent: string(TWO)

  WhiteheadStrategy:
    is_a: DecisionStrategySpec
    attributes:
      kind:
        range: string
        equals_string: whitehead
        ifabsent: string(whitehead)
      alpha:
        range: float
        required: true
      beta:
        range: float
        required: true
      sided:
        range: Sided
        ifabsent: string(TWO)

  # ---- Information Timer ----

  InformationTimerBase:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true

  SampleSizeTimer:
    is_a: InformationTimerBase
    attributes:
      kind:
        range: string
        equals_string: sample_size
        ifabsent: string(sample_size)
      # Aligning unit with existing engine expected type GST.Unit
      unit:
        range: Unit
        ifabsent: string(INDIVIDUALS)
      max_sample_size:
        range: integer
        multivalued: true
        inlined: true
        required: true
        annotations:
          python_range:
            tag: python_range
            value: Dict[str, int]

  FisherInformationTimer:
    is_a: InformationTimerBase
    attributes:
      kind:
        range: string
        equals_string: fisher_information
        ifabsent: string(fisher_information)
      max_information:
        range: float
        required: true

  EventCountTimer:
    is_a: InformationTimerBase
    attributes:
      kind:
        range: string
        equals_string: event_count
        ifabsent: string(event_count)
      max_events:
        range: integer
        required: true

  # ---- Schedule ----

  ScheduleSpec:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true

  FixedSchedule:
    is_a: ScheduleSpec
    attributes:
      kind:
        range: string
        equals_string: fixed
        ifabsent: string(fixed)
      analyses:
        range: float
        multivalued: true
        required: true

  EquidistantSchedule:
    is_a: ScheduleSpec
    attributes:
      kind:
        range: string
        equals_string: equidistant
        ifabsent: string(equidistant)
      n_looks:
        range: integer
        required: true

  # ---- Trigger Strategy ----

  ScheduleTrigger:
    is_a: Log
    attributes:
      kind:
        range: string
        required: true
      # Promoting to base class for controller accessibility
      index:
        range: integer
      value:
        range: float
      tolerance:
        range: float
        ifabsent: float(0.0)

  # Code (trigger_strategies.py:4) looks for DueLookTrigger
  DueLookTrigger:
    is_a: ScheduleTrigger
    attributes:
      kind:
        range: string
        equals_string: due_look
        ifabsent: string(due_look)

  # ---- Adaptation ----

  PromisingZoneSpec:
    is_a: Log
    attributes:
      conditional_power_threshold_min:
        range: float
        required: true
      conditional_power_threshold_max:
        range: float
        required: true
      target_conditional_power:
        range: float
        required: true

  SampleSizeReestimationSpec:
    is_a: Log
    attributes:
      type:
        range: string
        equals_string: sample_size_reestimation
        ifabsent: string(sample_size_reestimation)
      method:
        range: Method
        required: true
      target_power:
        range: float
        required: true
      use_weighted_statistic:
        range: boolean
        ifabsent: true
      n_range:
        range: integer
        multivalued: true
        inlined: true
        annotations:
          python_range:
            tag: python_range
            value: List[int]

      promising_zone:
        range: PromisingZoneSpec
        inlined: true

  AdaptationSpec:
    is_a: Log
    attributes:
      sample_size_reestimation:
        range: SampleSizeReestimationSpec
        inlined: true

  AdaptationSnapshot:
    is_a: Log
    attributes:
      z_t:
        range: float
        required: true
      info_frac:
        range: float
        required: true
      original_max_sample_size:
        range: integer
        required: true
      use_weighted_statistic:
        range: boolean
        ifabsent: true

  # ---- Policy ----

  StoppingPolicySpec:
    is_a: Log
    attributes:
      statistic:
        range: TestStatisticSpec
        required: true
        inlined: true
        any_of:
          - range: TwoArmBinomialZ
          - range: OneArmBinomialZ
          - range: BinomialExactStatistic
          - range: TwoArmContinuousZ
          - range: OneArmContinuousZ
      # In order to allow strategy: strategy_cls(**kwargs) to work,
      # strategy range must be a base class or union of ALL strategies.
      strategy:
        range: DecisionStrategySpec
        required: true
        inlined: true
        any_of:
          - range: AlphaSpendingStrategy
          - range: BetaSpendingStrategy
          - range: AlphaBetaSpendingStrategy
          - range: OBrienFlemingStrategy
          - range: PocockStrategy
          - range: WangTsiatisStrategy
          - range: WhiteheadStrategy
      timer:
        range: InformationTimerBase
        required: true
        inlined: true
        any_of:
          - range: SampleSizeTimer
          - range: FisherInformationTimer
          - range: EventCountTimer
      schedule:
        range: ScheduleSpec
        required: true
        inlined: true
        any_of:
          - range: FixedSchedule
          - range: EquidistantSchedule
      trigger_strategy:
        range: ScheduleTrigger
        inlined: true

  # ---- Task & Method & GSTProtocol ----

  EffectSizeUnion:
    union_of:
      - BinaryEffectSize
      - ContinuousEffectSize
      - SurvivalEffectSize

  HypothesisSpec:
    is_a: Log
    attributes:
      h_null_description:
        range: string
        required: true
      h_alt_description:
        range: string
        required: true
      test_logic:
        range: HypothesisParametersBase
        required: true
        inlined: true
        any_of:
          - range: EqualityHypothesis
          - range: SuperiorityHypothesis
          - range: NonInferiorityHypothesis
          - range: EquivalenceHypothesis
      target_effect:
        range: EffectSizeUnion
        required: true
        inlined: true

  GSTTaskSpec:
    is_a: TaskSpec
    description: "Task (Trial Design) specification specialized for Group Sequential Test (GST)."
    attributes:
      kind:
        range: string
        equals_string: group_sequential
        ifabsent: string(group_sequential)
      arms:
        range: ArmStructure
        required: true
        inlined: true
      response_type:
        range: ResponseType
        required: true
      hypotheses:
        range: HypothesisSpec
        multivalued: false
        required: true
        inlined: true
      efficacy:
        range: EfficacyRequirement
        required: true
        inlined: true
      futility:
        range: FutilityRequirement
        required: true
        inlined: true

  GSTMethodSpec:
    is_a: MethodSpec
    description: "Method specification specialized for Group Sequential Test (GST)."
    attributes:
      kind:
        range: string
        equals_string: group_sequential
        ifabsent: string(group_sequential)
      stopping_policy:
        range: StoppingPolicySpec
        required: true
        inlined: true
      adaptation:
        range: AdaptationSpec
        inlined: true
      adaptation_snapshot:
        range: AdaptationSnapshot
        inlined: true

  GSTProtocol:
    is_a: Protocol
    description: "GSTProtocol specialized for Group Sequential Test (GST)."
    attributes:
      task:
        range: GSTTaskSpec
        required: true
        inlined: true
      method:
        range: GSTMethodSpec
        required: true
        inlined: true

  # ---- Logs ----

  GSTLookResult:
    is_a: LookResult
    attributes:
      sample_n:
        range: integer
        required: true
      info_frac:
        range: float
        required: true
      z_stat:
        range: float
        required: true
      z_stats:
        range: float
        multivalued: true
        inlined: true
        annotations:
          python_range:
            tag: python_range
            value: Optional[Dict[str, float]]
      efficacy_boundary:
        range: float
      is_efficacy_crossed:
        range: boolean
        required: true
      futility_boundary:
        range: float
      is_futility_crossed:
        range: boolean
        required: true
      alpha_spent:
        range: float
      beta_spent:
        range: float
      status:
        range: DecisionStatus
        required: true

  AdaptationLog:
    is_a: Log
    attributes:
      look:
        range: integer
        required: true
      conditional_power:
        range: float
        required: true
      promising_zone_status:
        range: PromisingZoneStatus
        required: true
      promising_zone_recommendation:
        range: string
        required: true
      original_sample_size:
        range: integer
        required: true
      recommended_sample_size:
        range: integer

  # ArmMetrics, ArmStatus, Scoreboard are re-exported by the generator

  # ---- Multivariate (Stub) ----

  MultivariateGSTTaskSpec:
    is_a: GSTTaskSpec
    attributes:
      kind:
        range: string
        equals_string: group_sequential_multivariate
        ifabsent: string(group_sequential_multivariate)
      sub_tasks:
        range: GSTTaskSpec
        multivalued: true
        inlined: true
      arms:
        range: string
        multivalued: true
      hypotheses:
        range: HypothesisSpec
        multivalued: false
        required: true
        inlined: true
      alpha:
        range: float
      beta:
        range: float

  MultivariateGSTMethodSpec:
    is_a: GSTMethodSpec
    attributes:
      kind:
        range: string
        equals_string: group_sequential_multivariate
        ifabsent: string(group_sequential_multivariate)
      multiplicity_adjustment:
        range: MultiplicityAdjustment
        required: true

  MultivariateGSTProtocol:
    is_a: GSTProtocol
    attributes:
      task:
        range: MultivariateGSTTaskSpec
        required: true
        inlined: true
      method:
        range: MultivariateGSTMethodSpec
        required: true
        inlined: true
