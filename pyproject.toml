[tool.poetry]
name = "earlysign"
version = "0.0.0" # version is dynamically provided by poetry-dynamic-versioning during builds
description = "Early signs, faster decisions. A Python library for sequential/safe testing (alpha-spending, e-processes, etc.)."
authors = ["Takeshi Teshima <takeshi.78.teshima@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://early-sign.github.io/EarlySign"
repository = "https://github.com/early-sign/EarlySign"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

#==== Main repo dependencies ====#
[tool.poetry.dependencies]
python = ">=3.11,<4.0"
scipy = "^1.16.1"
numpy = "^2.3.2"
matplotlib = "^3.10.6"
ibis-framework = "^11.0.0"
pydantic = "^2.11.9"
tqdm = "^4.67.1"

[tool.poetry.extras]
examples = []

#==== Development ====#
[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1" # Example development
ipython = "^9.5.0" # Debugging
pudb = "^2025.1" # Debugging
pytest = "^8.4.1" # Tests
pytest-bdd = "^8.1.0" # BDD Tests
mypy = "^1.17.1" # Type validation
black = {extras = ["jupyter"], version = "^25.1.0"} # Formatting
## Docs
sphinx = "^8.2.3"
sphinx-book-theme = "1.1.4"
myst-parser = "^4.0.1"
sphinx-autodoc-typehints = "^3.2.0"
sphinx-copybutton = "^0.5.2"
sphinx-autobuild = "^2025.8.25"
myst-nb = "^1.3.0"
sphinx-intl = "^2.3.2"
babel = "^2.17.0"
sphinx-autoapi = "^3.6.0"
autodoc-pydantic = "^2.2.0"
ibis-framework = {extras = ["duckdb", "polars"], version = "^11.0.0"}
pytest-notebook = "^0.10.0"
isort = "^6.1.0"
ruff = "^0.12.0"

[tool.poetry.group.ci.dependencies]
pytest = "^8.4.1"

#==== Test tools ====#
[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
exclude = '''
/(\.|venv|\.venv|\.git|\.mypy_cache|\.pytest_cache|\.tox|build|dist|\.poetry|docs/_build)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["earlysign"]
src_paths = ["earlysign"]
include_trailing_comma = true
combine_as_imports = true
multi_line_output = 3

[tool.ruff]
line-length = 88
exclude = ["docs/_build", ".venv", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"earlysign/schema/ES3/**" = ["TID252"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["earlysign"]

[tool.mypy]
python_version = "3.11"  # Base version for compatibility
ignore_missing_imports = true
show_error_codes = true
strict = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_calls = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "earlysign/v0/templates/.*",
    "earlysign/v1/templates/.*",
    "earlysign/v1/tests/.*",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
# --nb-test-files is run the notebooks that do not follow the test naming convention: `test_*.ipynb`.
# --pdbcls=pudb.debugger:Debugger is used with optional `--pdb` or `--trace` so as to activate the pudb on post-mortem. Normally, these switches are not used. Use these switches when you write your own test and run pytest to debug.
addopts = "--import-mode=importlib --doctest-modules --pyargs -v --nb-test-files --pdbcls=pudb.debugger:Debugger"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
testpaths = ["earlysign", "docs/source"]
norecursedirs = ["docs/_build"]
# This tells pytest-notebook to test that the jupyter-notebook executions will not stop with an error (and not comparing the results with the expectation).
nb_diff_ignore = [
  "/cells/*/outputs",
  "/cells/*/execution_count",
  "/metadata/language_info",
  "/cells/*/outputs/*/*/*/state", # IPyWidgets
  "/metadata/widgets", # the collective ipywidget states of the notebook
]

#==== CI ====#
[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
# Note: poetry-dynamic-versioning has a known issue in which it adds blank lines pyproject.toml, breaking dependency writes.
# If that occurs, run `make format` and retry, or temporarily set `enable = false` under [tool.poetry-dynamic-versioning] before `poetry lock`.

[tool.poetry-dynamic-versioning]
# Enable the plugin to derive the package version from Git metadata (tags) at build time.
enable = true
vcs = "git" # Use Git for versioning
style = "pep440" # PEP 440 compliant versioning style
# Remove the "+..." local version part to avoid PyPI error
format-jinja = "{%- if distance == 0 -%}{{ base }}{%- else -%}{{ base }}.post{{ distance }}{%- endif -%}"

# Simplify publishing to TestPyPI
[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/legacy/"
priority = "explicit"

[tool.poetry-dynamic-versioning.files."earlysign/__version__.py"]
persistent-substitution = true
initial-content = """
  # These version placeholders will be replaced later during substitution.
  __version__ = "0.0.0"
  __version_tuple__ = (0, 0, 0)
"""
